<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Q1 Drill 2</title>

    <style>
        h1{font-family: Arial, sans-serif;
        text-align: center}
        h2{font-family: Arial, sans-serif;
        margin-bottom: 1px;}

        p{text-align: center}

       
        section {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            width: 600px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

     
        input[type="text"], textarea {
            width: 94%;
            padding: 10px;
            margin: auto;
        }

        img {
            display: block;
            width: 125px;
            height: 125px;
            border-radius: 10px;
            margin: auto
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: rgb(0, 86, 0);
            color: white;
            border: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

    <h1>RATE A MOVIE</h1>

    <p>Feel free to rate, review, and comment about a movie.</p>

    <section>

        <form>

            <img src="./Q1 Drill 2_files/movie icon.png" alt="logo">

            <br>

            <h2>Movie title</h2>
            <input type="text" id="movie" name="movie" placeholder="Type movie title">

            <br><br>

            <h2>Genre:</h2>
            <br>

            <input type="checkbox"> Action
            <input type="checkbox"> Adventure
            <input type="checkbox"> Comedy
            <input type="checkbox"> Drama
            <input type="checkbox"> Fantasy
            <input type="checkbox"> Horror
            <input type="checkbox"> Romance
            <input type="checkbox"> Other

            <br><br>

            <h2>Ratings</h2>
            <br>
            <input type="radio" id="rate1" name="rate" <label="" for="rate">⭐
            <input type="radio" id="rate2" name="rate" <label="" for="rate">⭐⭐
            <input type="radio" id="rate3" name="rate" <label="" for="rate">⭐⭐⭐
            <input type="radio" id="rate4" name="rate" <label="" for="rate">⭐⭐⭐⭐
            <input type="radio" id="rate5" name="rate" <label="" for="rate">⭐⭐⭐⭐⭐

            <br><br>

           <br>
            <textarea id="review" placeholder="Write a review" rows="4" cols="40"></textarea>

            <br><br>

            <input type="submit" value="Submit">

            <br>
            Click <a href="https://www.rottentomatoes.com/" target="_blank">here</a> for more movie details
     </form>

    </section>
<p>coded by basyti</p>

</body>
</html>
